name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the environment file.}

services:
  client:
    build:
      context: ..
      dockerfile: deploy/docker/client.Dockerfile
    image: ${ACCOUNT_IMAGE_PREFIX:?Set ACCOUNT_IMAGE_PREFIX}:client-${RELEASE_VERSION:?Set RELEASE_VERSION}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${ACCOUNT_PUBLIC_HOST:?Set ACCOUNT_PUBLIC_HOST}
      VIRTUAL_PORT: "80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - account-internal
      - shared-infrastructure
    mem_limit: 128m
    cpus: 0.25

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    image: ${ACCOUNT_IMAGE_PREFIX}:server-${RELEASE_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Set ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      DataProtection__KeyRingPath: /var/lib/yaeay/data-protection-keys
      DataProtection__ApplicationName: YaeaY.Account
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - server-data-protection:/var/lib/yaeay/data-protection-keys
    networks:
      - account-internal
      - shared-infrastructure
    mem_limit: 512m
    cpus: 1.00

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    image: ${ACCOUNT_IMAGE_PREFIX}:worker-${RELEASE_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - account-internal
      - shared-infrastructure
    mem_limit: 384m
    cpus: 0.75

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${Messaging__RabbitMq__UserName:?Set Messaging__RabbitMq__UserName}
      RABBITMQ_DEFAULT_PASS: ${Messaging__RabbitMq__Password:?Set Messaging__RabbitMq__Password}
      RABBITMQ_DEFAULT_VHOST: ${Messaging__RabbitMq__VirtualHost:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - account-internal
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 8

networks:
  account-internal:
    internal: true
  shared-infrastructure:
    external: true
    name: ${SHARED_INFRASTRUCTURE_NETWORK:-yaeay_network}

volumes:
  server-data-protection:
  rabbitmq-data:
