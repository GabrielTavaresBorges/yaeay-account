name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: [self-hosted, yaeay-account, dev-deploy]

    steps:
      - name: Go to repository and update develop
        run: |
          cd /opt/yaeay/apps/yaeay-account/source
          git checkout develop
          git pull origin develop

      - name: Build and start dev environment
        run: |
          cd /opt/yaeay/apps/yaeay-account/environments/dev/compose
          docker compose up -d --build

      - name: Show running containers
        run: |
          cd /opt/yaeay/apps/yaeay-account/environments/dev/compose
          docker compose ps
